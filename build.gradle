buildscript {
    repositories {
        gradlePluginPortal()
        flatDir {
            dirs 'libs'
        }
        dependencies {
            classpath name: 'package-compileonly-sdk', version: '1.7.0'
            classpath "com.gradleup.shadow:shadow-gradle-plugin:9.1.0"
        }
    }
}

plugins {
    id 'java'
    id 'com.github.ben-manes.versions' version '0.53.0'
}

configure(allprojects) {

    apply plugin: 'com.gradleup.shadow'
    apply plugin: "com.automationanywhere.command-codegen"

    ext {
        groupName = 'com.automationanywhere'
        testNgVersion = '7.12.0'
        loggerVersion = '2.25.3'
        version '3.6.0'
    }
    group "$groupName"

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(11)
        }
    }

    compileJava.options.encoding = 'UTF-8'
    compileTestJava.options.encoding = 'UTF-8'

    repositories {
        mavenCentral()
        flatDir {
            dirs 'libs'
        }
    }

    packageJson {
        artifactName = project.name
        group = "$groupName"
        author = "Sumit Kumar"
        generatePackageWithDateTime = false
    }

    jar.dependsOn commandCodeGen

    shadowJar {
        archiveBaseName = project.name
        archiveClassifier = ''
        mergeServiceFiles('META-INF/spring.*')
        mergeServiceFiles('META-INF/services/java.sql.Driver')
        zip64 = true
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
    }

    dependencies {
        annotationProcessor name: 'package-compileonly-sdk', version: '1.7.0'
        compileOnly name: 'package-compileonly-sdk', version: '1.7.0'
        implementation name: 'package-runtime-sdk', version: '1.0.0'
        testImplementation name: 'package-compileonly-sdk', version: '1.7.0'
        testImplementation group: "org.testng", name: "testng", version: "$testNgVersion"
        testImplementation 'org.mockito:mockito-core:5.23.0'

        //table and record type use this internally and is required for table and record value types
        testImplementation 'com.google.protobuf:protobuf-java:4.34.1'

        //https://mvnrepository.com/artifact/org.seleniumhq.selenium/selenium-java
        implementation 'org.seleniumhq.selenium:selenium-support:4.43.0'
        implementation 'org.seleniumhq.selenium:selenium-edge-driver:4.43.0'
        implementation 'org.seleniumhq.selenium:selenium-chrome-driver:4.43.0'
        implementation 'org.jsoup:jsoup:1.22.1'
    }

}
